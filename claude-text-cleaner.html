<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude Output Cleaner</title>
<style>
  :root {
    --bg: #F8F7F4;
    --surface: #FFFFFF;
    --border: #D5D2CB;
    --text: #2C2C2E;
    --text-dim: #7A7870;
    --accent: #5866B8;
    --accent-hover: #4955A6;
    --accent-text: #FFFFFF;
    --textarea-bg: #FDFCFA;
    --copied-bg: #E8F0E8;
    --copied-text: #3A6B3A;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1C1D21;
      --surface: #26272C;
      --border: #3C3D44;
      --text: #E0DDD6;
      --text-dim: #8A8880;
      --accent: #7B88D4;
      --accent-hover: #8D99E0;
      --accent-text: #1C1D21;
      --textarea-bg: #22232A;
      --copied-bg: #2A3A2A;
      --copied-text: #7BC47B;
    }
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  header {
    padding: 20px 24px 0;
    display: flex;
    align-items: baseline;
    gap: 12px;
  }

  header h1 {
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.02em;
    margin: 0;
  }

  header p {
    font-size: 13px;
    color: var(--text-dim);
    margin: 0;
  }

  .workspace {
    flex: 1;
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    gap: 0;
    padding: 16px 24px 24px;
    min-height: 0;
  }

  .panel {
    display: flex;
    flex-direction: column;
    min-height: 0;
    min-width: 0;
  }

  .panel-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 0 8px;
    min-height: 32px;
  }

  .panel-label {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-dim);
  }

  textarea {
    flex: 1;
    width: 100%;
    min-height: 400px;
    padding: 16px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--textarea-bg);
    color: var(--text);
    font-family: "SF Mono", "Fira Code", "Fira Mono", "Roboto Mono", "Cascadia Code", Menlo, Consolas, monospace;
    font-size: 13px;
    line-height: 1.6;
    resize: none;
    outline: none;
    transition: border-color 0.15s;
  }

  textarea:focus {
    border-color: var(--accent);
  }

  textarea.output {
    cursor: default;
  }

  .divider {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 36px 16px 0;
    gap: 12px;
  }

  .divider-line {
    width: 1px;
    flex: 1;
    background: var(--border);
  }

  button {
    font-family: inherit;
    cursor: pointer;
    border: none;
    outline: none;
    transition: background-color 0.15s, transform 0.1s;
  }

  button:active {
    transform: scale(0.97);
  }

  button:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  .btn-primary {
    background: var(--accent);
    color: var(--accent-text);
    font-size: 13px;
    font-weight: 600;
    padding: 8px 16px;
    border-radius: 6px;
    white-space: nowrap;
  }

  .btn-primary:hover {
    background: var(--accent-hover);
  }

  .btn-primary.copied {
    background: var(--copied-bg);
    color: var(--copied-text);
  }

  .btn-ghost {
    background: transparent;
    color: var(--text-dim);
    font-size: 12px;
    font-weight: 500;
    padding: 4px 10px;
    border-radius: 4px;
  }

  .btn-ghost:hover {
    background: var(--border);
    color: var(--text);
  }

  .options {
    padding: 0 24px;
    display: flex;
    gap: 16px;
    align-items: center;
  }

  .options label {
    font-size: 13px;
    color: var(--text-dim);
    display: flex;
    align-items: center;
    gap: 6px;
    cursor: pointer;
    user-select: none;
  }

  .options input[type="checkbox"] {
    accent-color: var(--accent);
    width: 14px;
    height: 14px;
  }

  .char-count {
    font-size: 11px;
    color: var(--text-dim);
    font-variant-numeric: tabular-nums;
  }

  @media (max-width: 768px) {
    .workspace {
      grid-template-columns: 1fr;
      grid-template-rows: 1fr auto 1fr;
      padding: 12px 16px 16px;
    }

    header {
      padding: 16px 16px 0;
      flex-direction: column;
      gap: 4px;
    }

    .divider {
      flex-direction: row;
      padding: 12px 0;
    }

    .divider-line {
      width: auto;
      height: 1px;
      flex: 1;
    }

    textarea {
      min-height: 200px;
    }

    .options {
      padding: 0 16px;
      flex-wrap: wrap;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      transition-duration: 0s !important;
    }
  }
</style>
</head>
<body>

<header>
  <h1>Claude Output Cleaner</h1>
  <p>Paste terminal output &rarr; get clean text</p>
</header>

<div class="options">
  <label>
    <input type="checkbox" id="opt-strip-spaces" checked>
    Strip leading spaces
  </label>
  <label>
    <input type="checkbox" id="opt-join-lines" checked>
    Join wrapped lines
  </label>
  <label>
    <input type="checkbox" id="opt-preserve-code" checked>
    Preserve code blocks
  </label>
</div>

<div class="workspace">
  <div class="panel">
    <div class="panel-header">
      <span class="panel-label">Input</span>
      <button class="btn-ghost" id="btn-clear" aria-label="Clear input">Clear</button>
    </div>
    <textarea id="input" placeholder="Paste Claude Code output here..." spellcheck="false" autofocus></textarea>
  </div>

  <div class="divider">
    <div class="divider-line"></div>
    <div class="divider-line"></div>
  </div>

  <div class="panel">
    <div class="panel-header">
      <span class="panel-label">Output <span class="char-count" id="char-count"></span></span>
      <button class="btn-primary" id="btn-copy">Copy</button>
    </div>
    <textarea id="output" class="output" readonly placeholder="Cleaned text appears here..." spellcheck="false"></textarea>
  </div>
</div>

<script>
  const input = document.getElementById('input');
  const output = document.getElementById('output');
  const btnCopy = document.getElementById('btn-copy');
  const btnClear = document.getElementById('btn-clear');
  const charCount = document.getElementById('char-count');
  const optStripSpaces = document.getElementById('opt-strip-spaces');
  const optJoinLines = document.getElementById('opt-join-lines');
  const optPreserveCode = document.getElementById('opt-preserve-code');

  // Remove the indent all non-blank lines share, keeping relative nesting.
  // Skip line 1: terminal selections often start mid-line with no indent.
  function dedent(lines) {
    const rest = lines.slice(1).filter(l => l.trim());
    const indents = (rest.length ? rest : lines.filter(l => l.trim()))
      .map(l => l.match(/^[ \t]*/)[0].length);
    const min = indents.length ? Math.min(...indents) : 0;
    return lines.map(l => l.slice(Math.min(min, l.match(/^[ \t]*/)[0].length)));
  }

  function cleanText(raw) {
    const stripSpaces = optStripSpaces.checked;
    const joinLines = optJoinLines.checked;
    const preserveCode = optPreserveCode.checked;

    if (!raw.trim()) return '';

    let lines = raw.split('\n');

    if (stripSpaces) {
      lines = dedent(lines);
    }

    // Strip Claude Code's leading bullet marker (⏺ U+23FA or similar)
    lines = lines.map(l => l.replace(/^[⏺◉●⬤]\s?/, ''));

    if (!joinLines) {
      return lines.join('\n').replace(/\n{3,}/g, '\n\n').trim();
    }

    const result = [];
    let inCodeBlock = false;
    let buffer = '';
    let quoteBuffer = '';

    function flushBuffer() {
      if (buffer) {
        result.push(buffer);
        buffer = '';
      }
    }

    for (let i = 0; i < lines.length; i++) {
      const line = lines[i];
      const indent = line.match(/^[ \t]*/)[0];
      const trimmed = line.trim();

      if (preserveCode && /^```/.test(trimmed)) {
        flushBuffer();
        inCodeBlock = !inCodeBlock;
        result.push(trimmed);
        continue;
      }

      if (inCodeBlock) {
        flushBuffer();
        result.push(line);
        continue;
      }

      if (trimmed === '') {
        flushBuffer();
        result.push('');
        continue;
      }

      if (/^▎/.test(trimmed)) {
        const quoteContent = trimmed.replace(/^▎\s?/, '').trim();
        if (quoteBuffer === '') {
          quoteBuffer = quoteContent;
        } else {
          quoteBuffer += ' ' + quoteContent;
        }
        const nextLine = i + 1 < lines.length ? lines[i + 1] : null;
        const nextTrimmed = nextLine !== null ? (stripSpaces ? nextLine.replace(/^\s+/, '') : nextLine).trimEnd() : null;
        if (nextTrimmed === null || !/^▎/.test(nextTrimmed)) {
          flushBuffer();
          result.push('> ' + quoteBuffer);
          quoteBuffer = '';
        }
        continue;
      }

      // Isolated structural lines (headings, rules, blockquotes, ALL CAPS labels)
      const isIsolated =
        /^#{1,6}\s/.test(trimmed) ||
        /^>\s?/.test(trimmed) ||
        /^[-*_]{3,}\s*$/.test(trimmed) ||
        /^[A-Z][A-Z\s]{4,}:?\s*$/.test(trimmed);

      if (isIsolated) {
        flushBuffer();
        result.push(trimmed);
        continue;
      }

      // List items start a new paragraph but allow continuation lines to join
      const isListItem =
        /^[-*+]\s/.test(trimmed) ||
        /^\d+[.)]\s/.test(trimmed);

      if (isListItem) {
        flushBuffer();
      }

      if (buffer === '') {
        buffer = isListItem ? indent + trimmed : trimmed;
      } else {
        buffer += ' ' + trimmed;
      }

      const nextLine = i + 1 < lines.length ? lines[i + 1] : null;
      if (nextLine === null) {
        flushBuffer();
      }
    }

    flushBuffer();

    return result.join('\n').replace(/\n{3,}/g, '\n\n').trim();
  }

  function process() {
    const cleaned = cleanText(input.value);
    output.value = cleaned;
    charCount.textContent = cleaned.length > 0 ? `${cleaned.length} chars` : '';
  }

  input.addEventListener('input', process);
  optStripSpaces.addEventListener('change', process);
  optJoinLines.addEventListener('change', process);
  optPreserveCode.addEventListener('change', process);

  btnClear.addEventListener('click', () => {
    input.value = '';
    output.value = '';
    charCount.textContent = '';
    input.focus();
  });

  btnCopy.addEventListener('click', async () => {
    const text = output.value;
    if (!text) return;

    try {
      await navigator.clipboard.writeText(text);
      btnCopy.textContent = 'Copied';
      btnCopy.classList.add('copied');
      setTimeout(() => {
        btnCopy.textContent = 'Copy';
        btnCopy.classList.remove('copied');
      }, 1500);
    } catch {
      output.select();
      document.execCommand('copy');
      btnCopy.textContent = 'Copied';
      btnCopy.classList.add('copied');
      setTimeout(() => {
        btnCopy.textContent = 'Copy';
        btnCopy.classList.remove('copied');
      }, 1500);
    }
  });

  input.addEventListener('paste', () => {
    requestAnimationFrame(process);
  });
</script>

</body>
</html>
